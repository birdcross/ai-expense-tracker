services:
  - type: web
    name: sseumlog-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: production
      - key: STORAGE_MODE
        value: firestore
      - key: FIREBASE_PROJECT_ID
        value: sseumlog
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: VISION_PROVIDER
        value: anthropic
      - key: VISION_MODEL
        value: claude-haiku-4
      - key: ANTHROPIC_BASE_URL
        value: https://copa.codyssey.kr
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
